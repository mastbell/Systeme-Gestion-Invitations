<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des invités</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #131b2a;
    --panel: rgba(17, 23, 34, 0.82);
    --line: rgba(255,255,255,0.08);
    --text: #edf2ff;
    --muted: #9ea9be;
    --gold: #d4af37;
    --gold-soft: rgba(212,175,55,0.13);
    --success: #31d0aa;
    --danger: #ff6b6b;
    --shadow: 0 22px 46px rgba(2, 7, 18, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 18px;
    font-family: Inter, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(212,175,55,0.12), transparent 22%),
      radial-gradient(circle at bottom right, rgba(90,125,255,0.10), transparent 26%),
      var(--bg);
    color: var(--text);
  }

  .app-shell {
    max-width: 840px;
    margin: 0 auto;
    animation: fadeUp 0.55s ease both;
  }

  .page-header {
    margin-bottom: 24px;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 11px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 4vw, 2.8rem);
    letter-spacing: -0.05em;
  }

  .card {
    background: linear-gradient(180deg, rgba(18,25,38,0.9), rgba(13,19,30,0.9));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px 20px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  h2 {
    margin: 0 0 18px;
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 16px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(212,175,55,0.1);
  }

  button {
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #f2d574);
    color: #111827;
    font-weight: 700;
    padding: 12px 18px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    box-shadow: 0 12px 22px rgba(212,175,55,0.22);
  }

  button:hover {
    transform: translateY(-1px);
    filter: brightness(1.02);
  }

  .resultat-shell {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    font-size: 14px;
    white-space: pre-wrap;
    min-height: 58px;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }

  .ok {
    background: rgba(49, 208, 170, 0.12);
    border-color: rgba(49,208,170,0.35);
    color: #bff7e8;
  }

  .err {
    background: rgba(255,107,107,0.12);
    border-color: rgba(255,107,107,0.35);
    color: #ffd2d2;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .form-grid {
      grid-template-columns: 1fr;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="page-header">
    <p class="eyebrow">Administration</p>
    <h1>Gestion de l'événement</h1>
  </header>

  <section class="card">
    <h2>1. Créer un événement</h2>
    <div class="form-grid">
      <div class="field full">
        <label>Nom de l'événement</label>
        <input id="ev-nom" placeholder="Gala annuel AgriVision">
      </div>
      <div class="field">
        <label>Date</label>
        <input id="ev-date" type="date">
      </div>
      <div class="field">
        <label>Lieu</label>
        <input id="ev-lieu" placeholder="Yaoundé, Hôtel Mont-Fébé">
      </div>
    </div>
    <button onclick="creerEvenement()">Créer l'événement</button>
  </section>

  <section class="card">
    <h2>2. Uploader le modèle d'invitation</h2>
    <div class="form-grid">
      <div class="field full">
        <label>Événement ID</label>
        <input id="modele-ev-id" type="number" placeholder="1">
      </div>
      <div class="field full">
        <label>Fichier image (PNG)</label>
        <input id="modele-fichier" type="file" accept="image/png">
      </div>
    </div>
    <button onclick="uploaderModele()">Uploader le modèle</button>
  </section>

  <section class="card">
    <h2>3. Ajouter un invité</h2>
    <div class="form-grid">
      <div class="field full">
        <label>Événement ID</label>
        <input id="inv-ev-id" type="number" placeholder="1">
      </div>
      <div class="field">
        <label>Nom</label>
        <input id="inv-nom">
      </div>
      <div class="field">
        <label>Prénom</label>
        <input id="inv-prenom">
      </div>
      <div class="field full">
        <label>Téléphone (format international, ex: +237...)</label>
        <input id="inv-tel">
      </div>
      <div class="field full">
        <label>Grade</label>
        <select id="inv-grade">
          <option value="classique">Classique</option>
          <option value="vip">VIP</option>
          <option value="prestige">Prestige</option>
        </select>
      </div>
    </div>
    <button onclick="ajouterInvite()">Ajouter l'invité et générer son invitation</button>
  </section>

  <div id="resultat" class="resultat-shell" aria-live="polite"></div>
</div>

<script>
function afficher(data, ok) {
  const el = document.getElementById("resultat");
  el.className = `resultat-shell ${ok ? "ok" : "err"}`;
  el.textContent = JSON.stringify(data, null, 2);
  el.animate([
    { transform: "translateY(8px)", opacity: 0.4 },
    { transform: "translateY(0)", opacity: 1 }
  ], { duration: 260, easing: "ease-out" });
}

async function creerEvenement() {
  const body = {
    nom: document.getElementById("ev-nom").value,
    date_evenement: document.getElementById("ev-date").value,
    lieu: document.getElementById("ev-lieu").value,
  };
  const r = await fetch("/evenements/", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  afficher(await r.json(), r.ok);
}

async function uploaderModele() {
  const evId = document.getElementById("modele-ev-id").value;
  const fichier = document.getElementById("modele-fichier").files[0];
  const form = new FormData();
  form.append("fichier", fichier);
  const r = await fetch(`/evenements/${evId}/modele`, { method: "POST", body: form });
  afficher(await r.json(), r.ok);
}

async function ajouterInvite() {
  const evId = document.getElementById("inv-ev-id").value;
  const body = {
    nom: document.getElementById("inv-nom").value,
    prenom: document.getElementById("inv-prenom").value,
    telephone: document.getElementById("inv-tel").value,
    grade: document.getElementById("inv-grade").value,
  };
  const r = await fetch(`/evenements/${evId}/invites/`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  afficher(await r.json(), r.ok);
}
</script>
</body>
</html>
