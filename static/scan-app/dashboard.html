<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Arrivées</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #121a2b;
    --panel: rgba(18, 25, 38, 0.82);
    --panel-alt: rgba(13, 19, 29, 0.9);
    --line: rgba(255,255,255,0.08);
    --text: #edf2ff;
    --muted: #9ea9be;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.18);
    --success: #31d0aa;
    --warning: #f5b942;
    --danger: #ff6b6b;
    --shadow: 0 18px 40px rgba(4, 10, 20, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(212,175,55,0.12), transparent 28%),
      radial-gradient(circle at bottom right, rgba(91, 127, 255, 0.12), transparent 30%),
      var(--bg);
    color: var(--text);
    padding: 32px 18px;
  }

  .app-shell {
    max-width: 1180px;
    margin: 0 auto;
    animation: fadeUp 0.6s ease both;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .eyebrow {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.9;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 2vw, 2.5rem);
    line-height: 1.2;
    letter-spacing: -0.04em;
  }

  .event-form {
    min-width: min(100%, 320px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 8px;
    letter-spacing: 0.04em;
  }

  .field-row {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }

  input {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    color: var(--text);
    padding: 12px 14px;
    font-size: 15px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(212,175,55,0.14);
  }

  button {
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #f3d67a);
    color: #111827;
    font-weight: 700;
    padding: 12px 18px;
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
    box-shadow: 0 10px 20px rgba(212,175,55,0.22);
  }

  button:hover {
    transform: translateY(-1px);
    filter: brightness(1.02);
  }

  .content {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 24px;
    align-items: start;
  }

  .grille {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .carte {
    background: linear-gradient(180deg, rgba(27,35,48,0.9), rgba(17,22,31,0.9));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    min-height: 132px;
  }

  .carte:hover {
    transform: translateY(-3px);
    border-color: rgba(212,175,55,0.4);
    box-shadow: 0 18px 36px rgba(9,17,32,0.46);
  }

  .carte .val {
    font-size: clamp(2rem, 2.2vw, 2.7rem);
    font-weight: 800;
    letter-spacing: -0.06em;
    margin-bottom: 8px;
  }

  .carte .lbl {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 12px;
  }

  .journal-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    backdrop-filter: blur(10px);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    color: var(--text);
  }

  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  .status-indicator::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--warning);
    box-shadow: 0 0 0 0 rgba(245,185,66,0.5);
    animation: pulse 1.8s infinite;
  }

  .status-indicator.is-live::before { background: var(--success); box-shadow: 0 0 0 0 rgba(49,208,170,0.5); }
  .status-indicator.is-offline::before { background: var(--danger); box-shadow: 0 0 0 0 rgba(255,107,107,0.5); }

  #journal {
    max-height: 360px;
    overflow-y: auto;
    padding: 12px;
    background: rgba(9,14,22,0.5);
  }

  #journal p {
    margin: 0;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    opacity: 0.9;
    transition: transform 0.25s ease, background 0.25s ease;
  }

  #journal p + p { margin-top: 10px; }

  #journal p:hover {
    transform: translateX(3px);
    background: rgba(212,175,55,0.04);
  }

  .empty {
    color: var(--muted);
    text-align: center;
    opacity: 0.8;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(245,185,66,0.45); }
    70% { box-shadow: 0 0 0 12px rgba(245,185,66,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,185,66,0); }
  }

  @media (max-width: 760px) {
    .content {
      grid-template-columns: 1fr;
    }
    .field-row {
      flex-direction: column;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Suivi</p>
      <h1>Tableau de bord — Arrivées</h1>
    </div>

    <div class="event-form">
      <label>ID de l'événement</label>
      <div class="field-row">
        <input id="ev-id" type="number" placeholder="1" aria-label="ID de l'événement">
        <button onclick="demarrer()">Suivre</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="grille" id="grille" aria-live="polite"></div>

    <section class="journal-panel" aria-live="polite">
      <div class="panel-header">
        <span>Journal</span>
        <span id="status-live" class="status-indicator">En attente</span>
      </div>
      <div id="journal"><p class="empty">Aucune arrivée enregistrée.</p></div>
    </section>
  </main>
</div>

<script>
let ws = null;

function setLiveState(mode, label) {
  const status = document.getElementById("status-live");
  status.classList.remove("is-live", "is-offline");
  if (mode === "live") status.classList.add("is-live");
  if (mode === "offline") status.classList.add("is-offline");
  status.textContent = label;
}

function addRevealAnimation(elements) {
  elements.forEach((el, index) => {
    el.style.opacity = "0";
    el.style.transform = "translateY(10px)";
    requestAnimationFrame(() => {
      el.style.transition = "opacity 0.4s ease, transform 0.4s ease";
      el.style.opacity = "1";
      el.style.transform = "translateY(0)";
      el.style.transitionDelay = `${index * 50}ms`;
    });
  });
}

async function chargerStats(evId) {
  try {
    const r = await fetch(`/evenements/${evId}/stats`);
    if (!r.ok) throw new Error("Stats indisponibles");
    const data = await r.json();
    const grille = document.getElementById("grille");
    const entries = Object.entries(data.par_grade || {});

    grille.innerHTML = `
      <div class="carte"><div class="val">${data.total_arrives ?? 0}/${data.total_invites ?? 0}</div><div class="lbl">Total arrivés</div></div>
      ${entries.map(([g, v]) => `
        <div class="carte"><div class="val">${v.arrives ?? 0}/${v.total ?? 0}</div><div class="lbl">${g.toUpperCase()}</div></div>
      `).join("")}
    `;

    addRevealAnimation([...grille.children]);
  } catch (error) {
    document.getElementById("grille").innerHTML = `
      <div class="carte"><div class="val">--</div><div class="lbl">Erreur</div></div>
    `;
    setLiveState("offline", "Erreur de chargement");
  }
}

function demarrer() {
  const evId = document.getElementById("ev-id").value;
  if (!evId) return;

  if (ws) ws.close();

  chargerStats(evId);

  const protocole = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${protocole}://${location.host}/ws/evenement/${evId}`);

  ws.onopen = () => setLiveState("live", "En direct");
  ws.onclose = () => setLiveState("offline", "Connexion fermée");
  ws.onerror = () => setLiveState("offline", "Erreur websocket");

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const journal = document.getElementById("journal");
    const ligne = document.createElement("p");
    ligne.textContent = `✅ ${new Date().toLocaleTimeString()} — ${data.prenom} ${data.nom} (${(data.grade || "").toUpperCase()})`;
    ligne.style.animation = "fadeUp 0.35s ease";
    journal.prepend(ligne);
    chargerStats(evId);
  };
}

document.getElementById("ev-id").addEventListener("keydown", (event) => {
  if (event.key === "Enter") demarrer();
});
</script>
</body>
</html>
