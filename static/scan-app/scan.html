<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan des invitations</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #131b2a;
    --panel: rgba(17, 23, 34, 0.82);
    --line: rgba(255,255,255,0.08);
    --text: #edf2ff;
    --muted: #9ea9be;
    --gold: #d4af37;
    --gold-soft: rgba(212,175,55,0.13);
    --success: #31d0aa;
    --warning: #f5b942;
    --danger: #ff6b6b;
    --shadow: 0 20px 45px rgba(2, 7, 18, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: Inter, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(212,175,55,0.12), transparent 20%),
      radial-gradient(circle at bottom right, rgba(92, 124, 255, 0.10), transparent 28%),
      var(--bg);
    color: var(--text);
  }

  .app-shell {
    width: min(100%, 560px);
    animation: fadeUp 0.55s ease both;
  }

  .scan-panel {
    background: linear-gradient(180deg, rgba(15,21,30,0.9), rgba(12,17,27,0.9));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px 20px 20px;
    box-shadow: var(--shadow);
  }

  .eyebrow {
    margin: 0 0 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 11px;
  }

  h1 {
    margin: 0 0 18px;
    font-size: clamp(1.9rem, 4vw, 2.5rem);
    letter-spacing: -0.04em;
  }

  .scanner-shell {
    min-height: 300px;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border: 1px solid var(--line);
    position: relative;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
  }

  #zone-scan {
    width: 100%;
    height: 100%;
  }

  #zone-scan video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
    display: block;
  }

  .resultat {
    margin-top: 18px;
    border-radius: 16px;
    padding: 18px 20px;
    min-height: 90px;
    border: 1px solid transparent;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    background: rgba(255,255,255,0.03);
    color: var(--text);
  }

  .resultat h2 {
    margin: 0 0 8px;
    font-size: 1.2rem;
  }

  .resultat p {
    margin: 0;
    color: rgba(255,255,255,0.78);
    font-size: 0.95rem;
  }

  .resultat--idle { background: rgba(255,255,255,0.03); border-color: var(--line); }
  .resultat--autorise { background: rgba(49, 208, 170, 0.12); border-color: rgba(49, 208, 170, 0.35); box-shadow: 0 16px 30px rgba(49,208,170,0.08); }
  .resultat--deja_scanne { background: rgba(245, 185, 66, 0.12); border-color: rgba(245,185,66,0.35); }
  .resultat--invalide { background: rgba(255,107,107,0.12); border-color: rgba(255,107,107,0.35); }

  .saisie-manuelle {
    margin-top: 20px;
    padding: 18px 16px 0;
    border-top: 1px solid var(--line);
  }

  .saisie-manuelle p {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .field-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  input {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(212,175,55,0.12);
  }

  button {
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #f3d67a);
    color: #111827;
    font-weight: 700;
    padding: 12px 18px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    box-shadow: 0 12px 20px rgba(212,175,55,0.18);
  }

  button:hover {
    transform: translateY(-1px);
    filter: brightness(1.03);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 560px) {
    .field-row {
      flex-direction: column;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="scan-panel">
    <p class="eyebrow">Accès</p>
    <h1>Scan des invitations</h1>
    <div id="zone-scan" class="scanner-shell"></div>
    <div id="resultat" class="resultat resultat--idle">En attente d'un scan…</div>

    <div class="saisie-manuelle">
      <p>QR illisible ?</p>
      <div class="field-row">
        <input id="token-manuel" placeholder="Token de l'invitation">
        <button onclick="traiterScan(document.getElementById('token-manuel').value)">Vérifier</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const params = new URLSearchParams(window.location.search);
const eventIdFromUrl = params.get('event');
if (eventIdFromUrl) {
  const evInput = document.getElementById('ev-id');
  if (evInput) evInput.value = eventIdFromUrl;
}

let scanEnCours = false;
const scanner = new Html5Qrcode("zone-scan");

async function traiterScan(token) {
  if (scanEnCours || !token) return;
  scanEnCours = true;

  try {
    const reponse = await fetch("/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token_qr: token }),
    });
    const data = await reponse.json();
    afficherResultat(data);
  } catch (e) {
    afficherResultat({ resultat: "invalide" });
  }

  setTimeout(() => { scanEnCours = false; }, 1800);
}

function afficherResultat(data) {
  const zone = document.getElementById("resultat");
  const styles = {
    autorise: { couleur: "resultat--autorise", texte: "✅ Accès autorisé" },
    deja_scanne: { couleur: "resultat--deja_scanne", texte: "⚠️ Déjà scanné" },
    invalide: { couleur: "resultat--invalide", texte: "❌ Invitation invalide" },
  };

  const s = styles[data.resultat] || styles.invalide;
  zone.className = `resultat ${s.couleur}`;
  zone.innerHTML = `<h2>${s.texte}</h2>` + (data.nom_complet ? `<p>${data.nom_complet} — ${data.grade.toUpperCase()}</p>` : "<p>Veuillez vérifier le code ou la caméra.</p>");
  zone.animate([
    { transform: "translateY(8px)", opacity: 0.4 },
    { transform: "translateY(0)", opacity: 1 }
  ], { duration: 260, easing: "ease-out" });
}

Html5Qrcode.getCameras().then(cameras => {
  if (cameras && cameras.length) {
    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, traiterScan);
  }
}).catch(() => {
  document.getElementById("zone-scan").innerHTML = "<div style='display:grid;place-items:center;height:100%;color:var(--muted);padding:20px;'>Caméra indisponible — utilisez la saisie manuelle ci-dessous.</div>";
});
</script>
</body>
</html>
