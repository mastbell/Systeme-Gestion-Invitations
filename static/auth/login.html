<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion | InvitationFlow</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(16, 22, 33, 0.85);
      --line: rgba(255,255,255,0.08);
      --text: #edf2ff;
      --muted: #9ea9be;
      --gold: #d4af37;
      --success: #31d0aa;
      --danger: #ff6b6b;
      --shadow: 0 22px 45px rgba(2, 7, 18, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(circle at top left, rgba(212,175,55,0.12), transparent 22%), radial-gradient(circle at bottom right, rgba(80,110,255,0.12), transparent 28%), var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }
    .auth-card {
      width: min(100%, 460px);
      background: linear-gradient(180deg, rgba(18,25,38,0.94), rgba(14,19,29,0.94));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px 22px;
      animation: fadeIn 0.5s ease;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 11px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.7rem);
      letter-spacing: -0.05em;
    }
    .subtitle { color: var(--muted); margin: 0 0 24px; }
    form {
      display: grid;
      gap: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      padding: 13px 14px;
      font-size: 15px;
      transition: 0.25s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212,175,55,0.1);
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      background: linear-gradient(135deg, var(--gold), #f3d67a);
      color: #111827;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 22px rgba(212,175,55,0.2);
    }
    button:hover { transform: translateY(-1px); }
    .message {
      margin-top: 10px;
      min-height: 22px;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .meta-links {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.92rem;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .meta-links a { color: var(--gold); text-decoration: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="auth-card">
    <p class="eyebrow">Accès sécurisé</p>
    <h1>Connexion</h1>
    <p class="subtitle">Gérez vos événements et vos accès avec un profil dédié.</p>

    <form id="loginForm">
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@demo.local" required />
      </div>
      <div>
        <label for="password">Mot de passe</label>
        <input id="password" type="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Se connecter</button>
    </form>

    <div id="message" class="message" aria-live="polite"></div>

    <div class="meta-links">
      <span>Comptes démo : admin@demo.local / admin123</span>
      <a href="/static/index.html">Accueil</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      message.className = 'message';
      message.textContent = 'Connexion en cours...';

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || 'Erreur de connexion');
        }

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('role', data.role);
        message.className = 'message success';
        message.textContent = 'Connexion réussie. Redirection...';

        setTimeout(() => {
          if (data.role === 'admin') window.location.href = '/static/admin/dashboard.html';
          else if (data.role === 'organisateur') window.location.href = '/static/organisateur/dashboard.html';
          else window.location.href = '/static/securite/dashboard.html';
        }, 600);
      } catch (error) {
        message.className = 'message error';
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
