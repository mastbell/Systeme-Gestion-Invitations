<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin</title>
  <style>
    :root { --bg:#0b1020; --panel:rgba(17,23,34,.86); --line:rgba(255,255,255,.08); --text:#edf2ff; --muted:#9ea9be; --gold:#d4af37; --success:#31d0aa; --danger:#ff6b6b; --shadow:0 22px 45px rgba(2,7,18,.5);} *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:28px 18px;background:radial-gradient(circle at top left, rgba(212,175,55,.12), transparent 22%), radial-gradient(circle at bottom right, rgba(80,110,255,.12), transparent 28%), var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif} .shell{max-width:1100px;margin:0 auto} .topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:22px;flex-wrap:wrap}.brand{font-size:1.5rem;font-weight:800;letter-spacing:-.05em}.menu{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:10px 16px;background:rgba(255,255,255,.02);color:var(--text);border:1px solid var(--line);border-radius:12px;text-decoration:none;font-weight:600;cursor:pointer} .btn.primary{background:linear-gradient(135deg,var(--gold),#f3d67a);color:#111827;border:none;box-shadow:0 12px 22px rgba(212,175,55,.18)} .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:22px 0}.card{background:linear-gradient(180deg, rgba(18,25,38,.9), rgba(13,19,30,.9));border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)} .card h3{margin:0 0 12px;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.big{font-size:2.3rem;font-weight:800;letter-spacing:-.06em;margin:0}.small{color:var(--muted);margin-top:6px} .table-wrap{background:linear-gradient(180deg, rgba(18,25,38,.9), rgba(13,19,30,.9));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-top:16px} table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left} th{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.12em} .badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(49,208,170,.12);color:#bff7e8;border:1px solid rgba(49,208,170,.35)} .muted{color:var(--muted)} @media (max-width: 760px){.cards{grid-template-columns:1fr}} </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">Admin<span style="color:var(--gold)">Board</span></div>
      <div class="menu">
        <a class="btn" href="/static/index.html">Accueil</a>
        <button class="btn primary" onclick="logout()">Déconnexion</button>
      </div>
    </header>

    <section class="cards">
      <div class="card"><h3>Événements</h3><p class="big" id="countEvents">0</p><div class="small">Total actifs</div></div>
      <div class="card"><h3>Organisateurs</h3><p class="big" id="countOrganisateurs">0</p><div class="small">Comptes enregistrés</div></div>
      <div class="card"><h3>Agents</h3><p class="big" id="countSecurite">0</p><div class="small">À sécuriser</div></div>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Rôle</th><th>Email</th><th>Statut</th></tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/static/auth/login.html';

    async function loadAdminData() {
      const meRes = await fetch('/auth/me', { headers: { Authorization: `Bearer ${token}` } });
      if (!meRes.ok) return window.location.href = '/static/auth/login.html';
      const me = await meRes.json();

      const users = await fetch('/auth/demo-users', { headers: { Authorization: `Bearer ${token}` } }).then(r => r.json());
      document.getElementById('countEvents').textContent = '3';
      document.getElementById('countOrganisateurs').textContent = users.filter(u => u.role === 'organisateur').length;
      document.getElementById('countSecurite').textContent = users.filter(u => u.role === 'securite').length;

      document.getElementById('usersTable').innerHTML = users.map(user => `
        <tr>
          <td><span class="badge">${user.role}</span></td>
          <td>${user.email}</td>
          <td class="muted">actif</td>
        </tr>
      `).join('');
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/static/auth/login.html';
    }

    loadAdminData();
  </script>
</body>
</html>
