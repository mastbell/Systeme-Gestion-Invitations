<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Organisateur</title>
  <style>
    :root { --bg:#0b1020; --panel:rgba(17,23,34,.86); --line:rgba(255,255,255,.08); --text:#edf2ff; --muted:#9ea9be; --gold:#d4af37; --success:#31d0aa; --danger:#ff6b6b; --shadow:0 22px 45px rgba(2,7,18,.5);} *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:28px 18px;background:radial-gradient(circle at top left, rgba(212,175,55,.12), transparent 22%), radial-gradient(circle at bottom right, rgba(80,110,255,.12), transparent 28%), var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif} .shell{max-width:980px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:20px;flex-wrap:wrap}.brand{font-weight:800;font-size:1.5rem;letter-spacing:-.05em}.btn{padding:10px 16px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text);border-radius:12px;text-decoration:none;font-weight:600;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),#f3d67a);color:#111827;border:none;box-shadow:0 12px 22px rgba(212,175,55,.18)} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{background:linear-gradient(180deg, rgba(18,25,38,.9), rgba(13,19,30,.9));border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)} h3{margin:0 0 18px;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)} .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:8px}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)} input,select{padding:12px 14px;border:none;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:var(--text)} .full{grid-column:1/-1} .result{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);white-space:pre-wrap;color:var(--text)} .ok{border-color:rgba(49,208,170,.35);background:rgba(49,208,170,.12);color:#bff7e8} .err{border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.12);color:#ffd2d2} @media (max-width:780px){.grid,.form-grid{grid-template-columns:1fr}} </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">Organisateur<span style="color:var(--gold)">Hub</span></div>
      <div>
        <button class="btn primary" onclick="logout()">Déconnexion</button>
      </div>
    </header>

    <section class="grid">
      <div class="panel">
        <h3>Créer un événement</h3>
        <div class="form-grid">
          <div class="field full"><label>Nom</label><input id="ev-nom" placeholder="Gala annuel" /></div>
          <div class="field"><label>Date</label><input id="ev-date" type="date" /></div>
          <div class="field"><label>Lieu</label><input id="ev-lieu" placeholder="Salle de réception" /></div>
        </div>
        <button class="btn primary" style="margin-top:16px;" onclick="creerEvenement()">Créer</button>
      </div>

      <div class="panel">
        <h3>Créer compte sécurité</h3>
        <div class="form-grid">
          <div class="field full"><label>Événement ID</label><input id="event-id" type="number" placeholder="1" /></div>
          <div class="field"><label>Nom</label><input id="sec-nom" /></div>
          <div class="field"><label>Prénom</label><input id="sec-prenom" /></div>
          <div class="field full"><label>Email</label><input id="sec-email" type="email" /></div>
          <div class="field full"><label>Mot de passe</label><input id="sec-password" type="password" /></div>
        </div>
        <button class="btn primary" style="margin-top:16px;" onclick="creerAgentSecurite()">Créer l’agent</button>
      </div>
    </section>

    <div id="resultat" class="result" aria-live="polite"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/static/auth/login.html';
    const resultat = document.getElementById('resultat');

    function setResult(message, ok) {
      resultat.className = `result ${ok ? 'ok' : 'err'}`;
      resultat.textContent = JSON.stringify(message, null, 2);
    }

    async function creerEvenement() {
      const payload = {
        nom: document.getElementById('ev-nom').value,
        date_evenement: document.getElementById('ev-date').value,
        lieu: document.getElementById('ev-lieu').value
      };
      const r = await fetch('/evenements/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      setResult(data, r.ok);
    }

    async function creerAgentSecurite() {
      const payload = {
        email: document.getElementById('sec-email').value,
        password: document.getElementById('sec-password').value,
        nom: document.getElementById('sec-nom').value,
        prenom: document.getElementById('sec-prenom').value,
        evenement_id: Number(document.getElementById('event-id').value)
      };
      const r = await fetch('/auth/register-security', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      setResult(data, r.ok);
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/static/auth/login.html';
    }
  </script>
</body>
</html>
